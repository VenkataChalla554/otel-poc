{{- include "hawk-opentelemetry.validate" . }}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "hawk-opentelemetry.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hawk-opentelemetry.labels" . | nindent 4 }}
automountServiceAccountToken: true
{{- end }}
