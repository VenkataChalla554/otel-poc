{{- include "hawk-opentelemetry.validate" . }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "hawk-opentelemetry.targetallocator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hawk-opentelemetry.targetallocator.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "hawk-opentelemetry.targetallocator.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.targetAllocator.service.port }}
      targetPort: http
      protocol: TCP
