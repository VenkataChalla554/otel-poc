# Shared ServiceAccount used by both the Collector and the Target Allocator.
serviceAccount:
  create: true
  name: tenant-hawk-otel

# Namespaces the Target Allocator may discover ServiceMonitor and PodMonitor
# resources from. The release namespace must be included so the Target
# Allocator can discover Collector pods.
allowedNamespaces:
  - tenant-hawk-hawk-test

# Applied to both Collector and Target Allocator pods.
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

# Dynatrace API token is read from this Secret. Do not put the token in this file.
dynatrace:
  secretName: dynatrace-otel-token
  secretKey: DT_API_TOKEN
  endpoint: "https://<environment-id>.live.dynatrace.com/api/v2/otlp"

# Allows the Collector and Target Allocator to reach pods in allowedNamespaces.
# An Ingress policy is created in each of those namespaces. An Egress policy is
# created for the Collector and Target Allocator pods in the release namespace.
networkPolicy:
  enabled: true
  # Pods that may be scraped. {} is every pod in the namespace.
  podSelector: {}

# Optional pull secret when the images are in a private registry.
imagePullSecrets: []
# - name: registry-credentials

collector:
  replicaCount: 1
  image:
    repository: otel/opentelemetry-collector-contrib
    version: "0.160.0"
    pullPolicy: IfNotPresent
  service:
    port: 13133
  scrapeInterval: 30s

targetAllocator:
  replicaCount: 1
  image:
    repository: ghcr.io/open-telemetry/opentelemetry-operator/target-allocator
    version: "0.159.0"
    pullPolicy: IfNotPresent
  service:
    port: 8080
  allocationStrategy: consistent-hashing
  filterStrategy: relabel-config
  scrapeInterval: 30s
